# Configuración de Pages CMS (https://pagescms.org)
# Sebas entra a app.pagescms.org con su cuenta de GitHub, abre este repositorio y edita
# proyectos, mundos, hoja de vida y textos con formularios. Cada cambio queda como commit
# y GitHub Actions vuelve a publicar el sitio solo. Todo es bilingüe: campos "es" y "en".

media:
  input: public/media
  output: media

components:
  bi:
    label: Texto bilingüe
    type: object
    fields:
      - { name: es, label: Español, type: string }
      - { name: en, label: English, type: string }
  bitext:
    label: Texto bilingüe largo
    type: object
    fields:
      - { name: es, label: Español, type: text }
      - { name: en, label: English, type: text }
  mediaItem:
    label: Medio
    type: object
    fields:
      - name: type
        label: Tipo
        type: select
        options: { values: [video, image, youtube] }
      - { name: src, label: Archivo o URL, type: string }
      - { name: poster, label: Póster / miniatura, type: string }
      - { name: youtubeId, label: ID de YouTube (solo si es YouTube), type: string }
      - { name: w, label: Ancho (px), type: number }
      - { name: h, label: Alto (px), type: number }
      - { name: caption, label: Pie de foto, component: bi }

content:
  - name: projects
    label: Proyectos
    type: collection
    path: content/projects
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [title, world, year, order]
      primary: title
      sort: [order]
    fields:
      - { name: id, label: ID (URL), type: string, required: true }
      - name: world
        label: Mundo
        type: select
        required: true
        options:
          values:
            - { value: stage, label: "01 · Stage & VJ" }
            - { value: motion, label: "02 · Motion" }
            - { value: vr, label: "03 · VR & Real-time" }
            - { value: games, label: "04 · Videojuegos" }
      - { name: order, label: Orden, type: number }
      - { name: title, label: Título, type: string, required: true }
      - { name: year, label: Año, type: string }
      - { name: role, label: Rol, component: bi }
      - { name: tools, label: Herramientas, type: string, list: true }
      - { name: summary, label: Resumen, component: bitext }
      - { name: poster, label: Póster, type: string }
      - { name: preview, label: Video de preview (.mp4), type: string }
      - { name: w, label: Ancho del preview (px), type: number }
      - { name: h, label: Alto del preview (px), type: number }
      - { name: color, label: Color del proyecto (hex), type: string }
      - { name: nodeType, label: Tipo de nodo (mundo VR), type: string }
      - name: liveSet
        label: Set en vivo (YouTube)
        type: object
        fields:
          - { name: youtubeId, label: ID de YouTube, type: string }
          - { name: url, label: URL, type: string }
          - { name: label, label: Texto del botón, component: bi }
      - { name: gallery, label: Galería, component: mediaItem, list: true }
      - name: pixelmap
        label: Pixel map / escenario 3D (solo mundo 01)
        type: object
        fields:
          - name: rig
            label: Tipo de rig
            type: select
            options:
              values:
                - { value: square, label: Cuadrada / rectangular }
                - { value: cross, label: Cruz }
                - { value: multi, label: Multi-pantalla (un video por pantalla) }
                - { value: curved, label: Pared curva panorámica }
                - { value: festival, label: Festival genérico (16:9 + IMAG) }
          - { name: label, label: Nombre del rig, type: string }
          - { name: canvas, label: "Lienzo [ancho, alto] px", type: number, list: true }
          - { name: width, label: Ancho físico del lienzo (m), type: number }
          - { name: cabinet, label: Gabinete LED (px), type: number }
          - { name: curve, label: Curvatura (radianes, rig curvo), type: number }
          - { name: bpm, label: BPM, type: number }
          - { name: hardware, label: Hardware / salida, type: string }
          - { name: image, label: Plantilla del pixel map, type: string }
          - name: slices
            label: Slices (Resolume › Advanced Output)
            type: object
            list: true
            fields:
              - { name: name, label: Nombre, component: bi }
              - { name: x, label: X, type: number }
              - { name: y, label: Y, type: number }
              - { name: w, label: Ancho, type: number }
              - { name: h, label: Alto, type: number }
              - { name: physical, label: Medida física, type: string }
              - { name: src, label: Fuente (rig multi), type: string }
              - { name: pos, label: "Posición [x, y] m (opcional)", type: number, list: true }
              - { name: size, label: "Tamaño [w, h] m (opcional)", type: number, list: true }
              - { name: ry, label: Rotación Y (rad), type: number }
          - { name: playlist, label: Clips de la pantalla, type: string, list: true }
          - name: scenes
            label: Escenas (rig multi)
            type: object
            list: true
            fields:
              - { name: label, label: Nombre, type: string }
              - name: sources
                label: Videos por fuente
                type: object
                fields:
                  - { name: cenefa, label: Cenefa, type: string }
                  - { name: central, label: Central, type: string }
                  - { name: lateral, label: Laterales, type: string }

  - name: worlds
    label: Mundos
    type: file
    path: content/worlds.json
    format: json
    list: true
    fields:
      - { name: id, label: ID, type: string }
      - { name: index, label: Número, type: string }
      - { name: accent, label: Color de acento, type: string }
      - { name: shortName, label: Nombre corto, component: bi }
      - { name: name, label: Nombre, component: bi }
      - { name: tagline, label: Bajada, component: bi }
      - { name: coords, label: Coordenadas (decorativo), type: string }
      - { name: preview, label: Video de la tarjeta, type: string }
      - { name: poster, label: Póster de la tarjeta, type: string }

  - name: site
    label: Sitio (bio y contacto)
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Nombre, type: string }
      - { name: alias, label: Alias, type: string }
      - { name: handle, label: Usuario de Instagram, type: string }
      - { name: city, label: Ciudad, type: string }
      - { name: timezone, label: Zona horaria, type: string }
      - { name: roleLine, label: Línea de roles (separados por ·), type: string }
      - { name: role, label: Rol, component: bi }
      - { name: bio, label: Bio, component: bitext }
      - { name: heroSubtitle, label: Texto del hub, component: bitext }
      - { name: email, label: Correo, type: string }
      - { name: linkedin, label: LinkedIn, type: string }
      - { name: instagram, label: Instagram, type: string }
      - { name: behance, label: Behance, type: string }
      - { name: available, label: Disponible, type: boolean }
