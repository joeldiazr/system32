# Configuración de Pages CMS (https://pagescms.org)
# Sebas entra a app.pagescms.org con su cuenta de GitHub, abre este repositorio
# y edita proyectos y textos con formularios. Cada cambio queda como commit y
# GitHub Actions vuelve a publicar el sitio solo.

media:
  input: public/media
  output: media

content:
  - name: projects
    label: Proyectos
    type: collection
    path: content/projects
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, category, year, order]
      primary: title
      sort: [order, year]
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: slug, label: Slug (URL y carpeta de medios), type: string, required: true, description: "Ej: peterblue-sonar-park-2026. Los archivos van en public/media/<slug>/" }
      - name: category
        label: Categoría
        type: select
        required: true
        options:
          values:
            - { value: visuales, label: Visuales }
            - { value: motion, label: Motion graphics }
            - { value: vr, label: VR / Real-time }
      - { name: order, label: Orden en el índice, type: number }
      - { name: featured, label: Destacado (tile grande en la grilla), type: boolean }
      - { name: year, label: Año, type: number }
      - { name: client, label: Cliente / artista, type: string }
      - { name: event, label: Evento / lugar, type: string }
      - { name: role, label: Rol, type: string, list: true }
      - { name: tools, label: Herramientas, type: string, list: true }
      - { name: summary, label: Resumen (una o dos frases), type: text }
      - { name: body, label: Descripción, type: text }
      - { name: credits, label: Créditos / aclaraciones, type: string }
      - { name: behance, label: Link a Behance, type: string }
      - { name: cover, label: Portada (video .mp4 o imagen), type: file }
      - name: media
        label: Material (galería)
        type: object
        list: true
        fields:
          - name: type
            label: Tipo
            type: select
            options: { values: [video, image] }
          - { name: src, label: Archivo, type: file }
          - { name: poster, label: Póster / miniatura, type: image }
          - { name: w, label: Ancho (px), type: number }
          - { name: h, label: Alto (px), type: number }
          - { name: caption, label: Pie de foto, type: string }
      - name: pixelmap
        label: Pixel map (vista 3D del escenario) — dejar vacío si no aplica
        type: object
        fields:
          - name: rig
            label: Tipo de rig
            type: select
            options:
              values:
                - { value: square, label: Pantalla cuadrada / rectangular }
                - { value: cross, label: Cruz }
                - { value: custom, label: Personalizado }
          - { name: label, label: Nombre del rig (HUD), type: string }
          - { name: canvas, label: "Lienzo de la composición [ancho, alto] en px", type: number, list: true }
          - { name: width, label: Ancho físico del lienzo (metros), type: number }
          - { name: cabinet, label: Tamaño de gabinete LED (px), type: number }
          - { name: bpm, label: BPM del show, type: number }
          - { name: image, label: Plantilla del pixel map (PNG de Resolume), type: image }
          - name: slices
            label: Slices (copiados de Resolume › Advanced Output)
            type: object
            list: true
            fields:
              - { name: name, label: Nombre, type: string }
              - { name: x, label: X (px), type: number }
              - { name: y, label: Y (px), type: number }
              - { name: w, label: Ancho (px), type: number }
              - { name: h, label: Alto (px), type: number }
              - { name: z, label: Profundidad en metros (opcional), type: number }
              - { name: ry, label: Rotación Y en radianes (opcional), type: number }
          - { name: playlist, label: Clips de la pantalla 3D (en orden), type: file, list: true }

  - name: site
    label: Sitio (bio y contacto)
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Nombre, type: string }
      - { name: alias, label: Alias, type: string }
      - { name: handle, label: Usuario de Instagram, type: string }
      - { name: city, label: Ciudad, type: string }
      - { name: timezone, label: Zona horaria, type: string }
      - { name: roles, label: Roles, type: string, list: true }
      - { name: bio, label: Bio, type: text }
      - { name: services, label: Servicios, type: string, list: true }
      - { name: tools, label: Herramientas, type: string, list: true }
      - { name: email, label: Correo, type: string }
      - { name: instagram, label: Instagram (URL), type: string }
      - { name: behance, label: Behance (URL), type: string }
      - { name: available, label: Disponible, type: boolean }
